name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q EdgeVolume.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: EdgeVolume
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeVolume-debug-apk
          path: EdgeVolume/app/build/outputs/apk/debug/app-debug.apk
